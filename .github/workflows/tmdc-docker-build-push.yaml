name: TMDC Docker Image CI workflow

on:
  push:
    tags:
      # e.g. 0.8.0-d1, v0.8.0-d1
      - '*-d*'

jobs:
  dev-release:
    name: Build and Push Quickwit Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Disk Space
        run: |
          df -h
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          df -h

      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build Docker image
        run: make build-tmdc-docker GITHUB_TAGS=${{ github.ref_name }} PLATFORM=linux/amd64

      - name: Push Docker image
        run: make push-tmdc-docker GITHUB_TAGS=${{ github.ref_name }}
